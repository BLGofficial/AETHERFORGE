apiVersion: apps/v1
kind: Deployment
metadata:
  name: aetherforge-control-plane-api
  namespace: aetherforge-system
  labels:
    app.kubernetes.io/name: aetherforge-api
    app.kubernetes.io/version: "1.0.0-rc1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aetherforge-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aetherforge-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: registry.aetherforge.internal/control-plane-api:1.0.0-rc1
          ports:
            - containerPort: 4100
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4100"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 4100
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aetherforge-control-plane-default-deny
  namespace: aetherforge-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aetherforge-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 4100
