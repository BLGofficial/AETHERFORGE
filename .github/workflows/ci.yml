name: AETHER FORGE Governed CI & Release Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    name: Contract, Typecheck, Security, E2E, Performance & SBOM Gate
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js 22+
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Generate contract JSON Schema and OpenAPI 3.1 artifacts
        run: pnpm schemas:generate

      - name: Run strict TypeScript typecheck
        run: pnpm typecheck

      - name: Run contract, security, abuse-case, E2E, and performance test suites
        run: pnpm test

      - name: Generate CycloneDX 1.5 SBOM, SLSA v1.0 Provenance & Signed RC Bundle
        run: pnpm rc:generate
